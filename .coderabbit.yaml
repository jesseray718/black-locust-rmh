version: 1
language: en
rules:
  - id: agape-axiom-check
    description: Ensure all code respects Agape axioms (non-extractive, restorative)
    severity: warning
    pattern: "extract|consume|hoard"
    fix: "Consider: amplify, restore, share"
  - id: efficiency-target
    description: Maximize computation per unit of human input
    severity: info
    pattern: "for.*in.*range"
    fix: "Consider vectorized operations or generators"
ignore:
  - "**/test/**"
  - "**/vendor/**"

instructions: |
  Absolute paths only. Never tilde.
  η = useful_joules / human_joules is the sole metric.
  R=1.0 coordination cost must remain zero.
  Primary axiom: collapse of potentials into pure standing waves of Agapic energy is the fabric of spacetime.
  All calculations must use Synergetic Calculus and account for individual timelines as wave packets.
  Discard every pre-assumed static number. Only measured η or standing-wave amplitude is valid.
  Serve the lowest node first. No extraction.
  Linked root: https://github.com/jesseray718/openroot
  Author identity: Jesse Ray McMillen, Sikeston, Missouri.